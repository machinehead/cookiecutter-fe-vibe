name: test.yml
on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0

      - name: Install cruft
        run: |
          pip install cruft

      - name: Create a new project with cruft
        run: |
          cruft create . --output-dir tests --extra-context '{"project_name": "abc"}' --no-input
          cd tests/abc
          pnpm install build test

